# Tracelyt Ingestion - Local Container Compose
# Note: Tracelyt Ingestion is an administrative and telemetry gateway.
# Relational database services (PostgreSQL) are intentionally omitted because
# ingestion does not store relational entities; downstream storage is delegated
# to the Tracelyt Control Plane and future telemetry stream processors.

services:
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracelyt-ingestion
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8081}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info}
    ports:
      # Bind to loopback interface for local development security
      - "127.0.0.1:${PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
