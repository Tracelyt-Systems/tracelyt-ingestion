name: Feature Request
description: Propose an architectural improvement or ingestion capability.
title: "[Feature]: "
labels: ["kind/feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an enhancement for Tracelyt Ingestion. Please review the [System Boundaries](docs/architecture/boundaries.md) to ensure your idea aligns with the telemetry ingestion scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What challenge or missing capability does this proposal address?
      placeholder: I am running into...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or protocol support you'd like to see implemented.
      placeholder: Provide a clear description...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches or workarounds have you considered?
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, references, or diagrams.
