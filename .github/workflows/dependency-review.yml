name: Dependency Review

# Scans pull requests for newly introduced dependency vulnerabilities and license compliance.
# Note: GitHub Dependency Review requires GitHub Advanced Security when run on private repositories;
# it is enabled automatically for public open-source repositories.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Tracelyt-Systems'

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@5a2ce3f5b92ee19cbb1541a4984c76d921601d7c # v4.3.4
        with:
          fail-on-severity: high
          deny-licenses: GPL-1.0-only, GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only
